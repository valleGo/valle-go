}

let rolP=null,rolOK=false;
function cargarRol(){   // una sola consulta a la vez, aunque varias partes de la app la pidan
  if(!rolP)rolP=cargarRolReal().finally(()=>{rolP=null});return rolP}
async function cargarRolReal(){
  if(!db||!sesion||!sesion.id){esAdmin=false;misCom=[];misSrv=[];rolOK=false;pintaHeader();return}
  if(!rolOK){   // muestra de inmediato el último rol conocido (así el botón Panel no parpadea ni desaparece)
    esAdmin=false;misCom=[];misSrv=[];
    try{const g=JSON.parse(localStorage.getItem("valle_rol_"+sesion.id)||"null");if(g){esAdmin=!!g.a;misCom=g.c||[];misSrv=g.s||[]}}catch(e){}
    pintaHeader()}
  let a,c,sv;
  for(let i=0;i<3;i++){
    try{[a,c,sv]=await Promise.all([db.from("admins").select("user_id").eq("user_id",sesion.id),db.from("comercios").select("id,nombre,mp_conectado,plan,ofrece_citas,ofrece_consulta").eq("dueno_id",sesion.id),db.from("servicios_perfiles").select("id,nombre,tipo").eq("dueno_id",sesion.id)])}catch(e){a=c=sv={error:e}}
    if(!a.error&&!c.error&&!sv.error)break;await new Promise(r=>setTimeout(r,1200*(i+1)))}
  if(a.error||c.error||sv.error){pintaHeader();notifAuto();return}   // falló la red: se conserva lo último que se sabía, no se oculta el botón
  esAdmin=!!(a.data&&a.data.length);misCom=(c.data||[]).map(x=>x.plan==="simple"?{...x,ofrece_consulta:false}:x);misSrv=sv.data||[];rolOK=true;   // agenda y citas: ambos planes; consulta de stock: solo Básico (PRODUCTOS)
  
  try{localStorage.setItem("valle_rol_"+sesion.id,JSON.stringify({a:esAdmin,c:misCom,s:misSrv}))}catch(e){}
  pintaHeader();escucharPedidos();escucharMisPedidos();escucharServicios();notifAuto();
}

// ---- Subir foto comprimida (WebP, máx. 1000 px) ----
async function subirFoto(archivo,carpeta,max=1000){
  const img=await createImageBitmap(archivo), esc2=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas"); c.width=Math.round(img.width*esc2); c.height=Math.round(img.height*esc2);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,"image/webp",0.75));
  const ruta=`${carpeta}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.webp`;
  const {error}=await db.storage.from("fotos").upload(ruta,blob,{cacheControl:"31536000",contentType:"image/webp"});
  if(error)throw error;
  return db.storage.from("fotos").getPublicUrl(ruta).data.publicUrl;
}

// Borrador automático: lo escrito en un formulario sobrevive a recargas, cambios de pestaña o de app (las fotos se vuelven a elegir)
const borrKey=k=>"valle_borrador_"+k;
function borrCampos(raiz){return[...raiz.querySelectorAll("input,select,textarea")].filter(x=>x.type!=="file"&&x.type!=="hidden")}
function borrGuardar(raiz,k){try{localStorage.setItem(borrKey(k),JSON.stringify(borrCampos(raiz).map(x=>x.type==="checkbox"?x.checked:x.value)))}catch(e){}}
function borrBorrar(k){try{localStorage.removeItem(borrKey(k))}catch(e){}}
function borrActivar(raiz,k){
  let rest=false;try{const g=JSON.parse(localStorage.getItem(borrKey(k))||"null"),cs=borrCampos(raiz);
    if(g&&g.length===cs.length){cs.forEach((x,i)=>{if(x.type==="checkbox")x.checked=!!g[i];else x.value=g[i]});raiz.querySelectorAll("[data-dsn]").forEach(c=>c.dispatchEvent(new Event("change",{bubbles:true})));rest=true}}catch(e){}
  const g=()=>borrGuardar(raiz,k);raiz.addEventListener("input",g);raiz.addEventListener("change",g);
  return rest}

function sonido(){   // timbre largo (unos 4 s) + vibración, para que no pase desapercibido
  try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400,150,800])}catch(e){}
  try{const a=new(window.AudioContext||window.webkitAudioContext)();if(a.state==="suspended")a.resume();
    const nota=(f,t,d)=>{const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=f;o.connect(g);g.connect(a.destination);
      g.gain.setValueAtTime(0,a.currentTime+t);g.gain.linearRampToValueAtTime(.35,a.currentTime+t+.03);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+d);o.start(a.currentTime+t);o.stop(a.currentTime+t+d+.05)};
    for(let i=0;i<4;i++){nota(880,i*1,.4);nota(1175,i*1+.45,.45)}}catch(e){}}
async function registrarPush(){   // crea (o renueva) la suscripción de este dispositivo y la guarda; no pide permiso
  const reg=await navigator.serviceWorker.ready;
  const llave=b64u(VAPID_PUBLIC);
  let sub=await reg.pushManager.getSubscription();
  if(sub){ // si la suscripción se hizo con otra llave (por ejemplo, una anterior), se descarta y se crea una nueva
    const k=sub.options&&sub.options.applicationServerKey?new Uint8Array(sub.options.applicationServerKey):null;
    if(!k||k.length!==llave.length||k.some((v,i)=>v!==llave[i])){
      try{await db.from("push_suscripciones").delete().eq("endpoint",sub.endpoint)}catch(e){}
      await sub.unsubscribe();sub=null}}
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:llave});
  const j=sub.toJSON();
  const r=await db.from("push_suscripciones").upsert({user_id:sesion.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:"endpoint"});
  if(r.error)throw r.error;
}

      document.body.appendChild(d);$("bnotifX").onclick=()=>{try{sessionStorage.setItem("bnotifX","1")}catch(e){}d.remove()};return}
    if(Notification.permission!=="default"||$("bnotif"))return;
    try{if(sessionStorage.getItem("bnotifX"))return}catch(e){}
    const d=document.createElement("div");d.id="bnotif";
    d.innerHTML='<span>'+txt+'</span><button id="bnotifOk">Activar</button><button id="bnotifX" aria-label="Cerrar">×</button>';

    $("bnotifOk").onclick=activarNotif;

  }catch(e){}
}

const COM_TR=0.05;
const numMX=s=>{const v=Math.round(parseFloat(String(s||"").replace(/[$,\s]/g,""))*100)/100;return isNaN(v)?0:v};
async function corteTransporte(mes,ids){
  const[Y,M]=mes.split("-").map(Number),fin=new Date(Y,M,1);
  let q=db.from("servicios_perfiles").select("id,nombre,activo,creado,whatsapp,promo_inicio").eq("tipo","transporte").order("nombre");if(ids)q=q.in("id",ids);
  const[pf,vj,pg]=await Promise.all([q,db.from("viajes").select("perfil_id,precio_num,comision,cobro_mp").eq("estado","Completada").eq("mes",mes),db.from("cobros_transporte").select("*").eq("mes",mes).order("pagado_en")]);
  if(pf.error)throw pf.error;
  const V=vj.data||[],PG=pg.data||[],R=[];
  (pf.data||[]).forEach(p=>{const v=V.filter(x=>x.perfil_id===p.id),n=v.length,activo=p.activo!==false&&(!p.creado||new Date(p.creado)<fin);if(!activo&&!n)return;
    const tot=r2m(v.reduce((t,x)=>t+Number(x.precio_num||0),0)),com=r2m(v.filter(x=>!x.cobro_mp).reduce((t,x)=>t+Number(x.comision||0),0)),comMP=r2m(v.filter(x=>x.cobro_mp).reduce((t,x)=>t+Number(x.comision||0),0)),
      mem=activo?memMes("simple",p.promo_inicio,mes):0,promo=promoEt(p.promo_inicio,mes),cobrar=r2m(com+mem),pags=PG.filter(x=>x.perfil_id===p.id),pag=r2m(pags.reduce((t,x)=>t+Number(x.monto),0));
    R.push({id:p.id,nombre:p.nombre,whatsapp:p.whatsapp,promo,n,tot,com,comMP,mem,cobrar,pag,pags,saldo:Math.max(0,r2m(cobrar-pag))})});
  return R}

function escucharServicios(){
  if(!db||canalSrv||!sesion||!sesion.id)return;
  const ch=db.channel("servicios-"+sesion.id);
  ["citas","consultas_stock","viajes"].forEach(t=>ch.on("postgres_changes",{event:"*",schema:"public",table:t},p=>{
    const n=p.new||{},esCita=t==="citas",esV=t==="viajes";
    if(p.eventType==="INSERT"&&n.cliente_id!==sesion.id){sonido();aviso(esV?"🚕 Nueva solicitud de viaje":esCita?"📅 Nueva solicitud de cita":"🔎 Nueva consulta de stock")}
    else if(p.eventType==="UPDATE"&&n.cliente_id===sesion.id&&n.cambio_por!==sesion.id&&(n.estado||"")!=="Pendiente"){sonido();aviso((esV?"🚕 Tu viaje: ":esCita?"📅 Tu cita: ":"🔎 Tu consulta: ")+n.estado)}
    refrescaSrv()}));
  canalSrv=ch.subscribe();
}

(function(){
  const ic='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>';
  const el=document.createElement("div");el.id="ptr";el.innerHTML=ic;document.body.appendChild(el);
  let y0=null,d=0,listo=false;const UMBRAL=90;
  const enCaja=t=>{for(let n=t;n&&n!==document.body&&n.nodeType===1;n=n.parentElement){const o=getComputedStyle(n).overflowY;if((o==="auto"||o==="scroll")&&n.scrollTop>0)return true}return false};
  const bloqueado=()=>document.querySelector(".panel.on,#dirPanel,.svpanel,.modal.on")!==null;
  const pon=(v,op)=>{el.style.transition="none";el.style.transform=`translateY(${v-60}px) rotate(${v*4}deg)`;el.style.opacity=op};
  addEventListener("touchstart",e=>{y0=null;if(e.touches.length!==1||(document.scrollingElement||document.documentElement).scrollTop>0||bloqueado()||enCaja(e.target))return;y0=e.touches[0].clientY;d=0;listo=false},{passive:true});
  addEventListener("touchmove",e=>{if(y0===null)return;d=e.touches[0].clientY-y0;
    if(d<=0){pon(0,0);if(d<-5)y0=null;return}
    if(e.cancelable)e.preventDefault();
    const v=Math.min(d*.5,UMBRAL*.7);pon(v,Math.min(1,d/UMBRAL));listo=d>=UMBRAL},{passive:false});
  addEventListener("touchend",()=>{if(y0===null)return;y0=null;
    if(listo){el.style.transition="transform .2s";el.style.transform="translateY(14px)";el.style.opacity=1;el.classList.add("go");setTimeout(()=>location.reload(),250)}
    else{el.style.transition="transform .2s,opacity .2s";el.style.transform="translateY(-60px)";el.style.opacity=0}});

})();
const BUILD="valle-go-v180";
// Compara la versión de esta pantalla con la publicada (sw.js sin caché). Si es distinta, se recarga sola: rápido y sin depender del service worker.
async function revisaVersion(){
  try{
    const r=await fetch("sw.js?_="+Date.now(),{cache:"no-store"});if(!r.ok)return;
    const m=/CACHE\s*=\s*"([^"]+)"/.exec(await r.text());
    if(m&&m[1]!==BUILD){
      const t=Number(sessionStorage.getItem("recV")||0);if(Date.now()-t<45000)return;   // evita recargas repetidas
      sessionStorage.setItem("recV",String(Date.now()));
      if(!ocupado())location.reload();else avisoNueva();
    }
  }catch(e){}
}
setTimeout(revisaVersion,1200);setInterval(()=>{if(!document.hidden)revisaVersion()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)revisaVersion()});
// ---- Actualización automática: al abrir la app (o volver a ella) se actualiza sola ----
let sinFoco=document.hidden?Date.now():0;
const ocupado=()=>document.querySelector(".panel.on,#dirPanel,.svpanel,#gF,#gSF")!==null||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
function nuevaVersion(){ if(!ocupado())location.reload(); else avisoNueva() }
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){sinFoco=Date.now();return}
  const fuera=sinFoco?Date.now()-sinFoco:0;sinFoco=0;
  if(fuera>15000&&!ocupado())location.reload();   // la app estuvo cerrada o en segundo plano: se recarga con lo más reciente
});
// ---- Aviso de "Nueva versión disponible" (solo si no se puede recargar sola, por ejemplo mientras escribes) ----
function avisoNueva(){
  if($("bnueva"))return;
  const d=document.createElement("div");d.id="bnueva";
  d.innerHTML='<span>✨ Hay una nueva versión de Valle GO.</span><button id="bnuevaOk">Actualizar</button><button id="bnuevaX" aria-label="Cerrar">×</button>';
  document.body.appendChild(d);

  $("bnuevaX").onclick=()=>d.remove();
}
if("serviceWorker"in navigator){
  const habia=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{try{reg.update()}catch(e){}
    const vigila=w=>w&&w.addEventListener("statechange",()=>{if(w.state==="installed"||w.state==="activated"){if(habia)nuevaVersion()}});
    reg.addEventListener("updatefound",()=>vigila(reg.installing));
    const busca=()=>{try{reg.update()}catch(e){}};
    setInterval(busca,5*60*1000);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)busca()});
  }).catch(()=>{});
}

// ---- Aviso de versión nueva: compara la página publicada con la que se cargó al abrir ----
(function(){let base=null,avisado=false;
  const huella=async()=>{const t=await (await fetch("index.html?v="+Date.now(),{cache:"no-store"})).text();let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return t.length+":"+h};
  async function revisa(){if(avisado||!navigator.onLine)return;
    try{const h=await huella();if(base===null){base=h;return}
      if(h!==base){avisado=true;const b=document.createElement("div");b.id="bnuevo";b.setAttribute("role","status");
        b.innerHTML='<span>✨ Hay una versión nueva de Valle GO</span><button id="bnuevoOk">Actualizar</button><button class="x" id="bnuevoX" aria-label="Cerrar">×</button>';
        document.body.appendChild(b);
        $("bnuevoOk").onclick=async()=>{try{const r=await navigator.serviceWorker.getRegistration();if(r)await r.update();const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}location.reload()};
        $("bnuevoX").onclick=()=>b.remove()}
    }catch(e){}}
  revisa();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")revisa()});
  setInterval(revisa,5*60*1000);
})();

// Menús laterales de la barra superior (perfil/redes a la izquierda, pedidos/carrito a la derecha)
(function(){
  const cierra=(salvo)=>document.querySelectorAll(".hz.open").forEach(z=>{if(z!==salvo){z.classList.remove("open");const b=z.querySelector(".rb");if(b)b.setAttribute("aria-expanded","false")}});
  document.addEventListener("click",e=>{
    const t=e.target.closest&&e.target.closest(".rb");
    if(t){const z=t.closest(".hz"),ab=!z.classList.contains("open");cierra(z);z.classList.toggle("open",ab);t.setAttribute("aria-expanded",String(ab));return}
    if(e.target.closest&&e.target.closest(".pmenu button")){setTimeout(()=>cierra(null),0);return}
    if(!(e.target.closest&&e.target.closest(".pmenu")))cierra(null)});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")cierra(null)});
  const n=document.getElementById("n"),bd=document.getElementById("bBadge");
  if(n&&bd){const sync=()=>{const v=parseInt(n.textContent,10)||0;bd.textContent=v>99?"99+":v;bd.hidden=v<=0};sync();new MutationObserver(sync).observe(n,{childList:true,characterData:true,subtree:true})}
})();
</script>
